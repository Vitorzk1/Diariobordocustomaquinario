<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Horas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <main class="container">
        <h1>Registro de Horas das Máquinas</h1>

        <form method="POST">
            <label for="maquina">Máquina:</label>
            <select id="maquina" name="maquina" required>
                <option value="">Selecione uma máquina</option>
                <option value="Trator">Trator</option>
                <option value="Colheitadeira">Colheitadeira</option>
                <option value="Plantadeira">Plantadeira</option>
            </select>

            <label for="data">Data:</label>
            <input type="date" id="data" name="data" required>

            <label for="horas">Horas trabalhadas:</label>
            <input type="number" id="horas" name="horas" min="1" step="0.5" required>

            <label for="descricao">Descrição:</label>
            <input type="text" id="descricao" name="descricao"
                   placeholder="Ex: Preparação do solo" required>

            <button type="submit">Registrar horas</button>
        </form>

        <h2>Registros realizados</h2>

        {% if registros %}
        <table>
            <thead>
                <tr>
                    <th>Máquina</th>
                    <th>Data</th>
                    <th>Horas</th>
                    <th>Descrição</th>
                </tr>
            </thead>
            <tbody>
                {% for registro in registros %}
                <tr>
                    <td>{{ registro.maquina }}</td>
                    <td>{{ registro.data }}</td>
                    <td>{{ registro.horas }}h</td>
                    <td>{{ registro.descricao }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        {% else %}
        <p>Nenhum registro realizado ainda.</p>
        {% endif %}
    </main>

</body>
</html>
