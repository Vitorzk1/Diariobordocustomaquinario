<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Diário de Bordo - Manutenção
    </title>

    <!-- CSS principal do projeto -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- Variáveis e estilos básicos -->
    <style>

        :root {
            --card-bg: #ffffff;
            --border-color: #e5e7eb;
            --text-muted: #6b7280;
            --danger: #ef4444;
            --amber: #f59e0b;
            --emerald: #10b981;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fa;
            color: #1f2937;
        }

        .container {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 1.5rem;
        }

        .page-header h2 {
            margin-top: 0;
            margin-bottom: 0.5rem;
        }

        .page-header p {
            margin-top: 0;
            color: var(--text-muted);
        }

        button,
        input,
        select {
            font-family: inherit;
        }

    </style>

</head>


<body>

    <!-- =====================================================
         CONTEÚDO PRINCIPAL
    ====================================================== -->

    <main class="container">

        {% block content %}

        {% endblock %}

    </main>


</body>

</html>
